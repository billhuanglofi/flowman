version: v1
name: uat
base_url: http://localhost:8080
endpoints:
  - name: payments
    path: /payments
oracle:
  dsn_env: FLOWMAN_EXAMPLE_UAT_ORACLE_DSN
  user_env: FLOWMAN_EXAMPLE_UAT_ORACLE_USER
  password_env: FLOWMAN_EXAMPLE_UAT_ORACLE_PASSWORD
trace:
  transaction_id:
    header: X-Transaction-ID
    json_paths:
      - $.transaction_id
      - $.data.transactionId
    regex: 'transaction_id=([A-Za-z0-9_-]+)'
  poll_interval: 2s
  timeout: 30s
