version: v1
name: uat
base_url: https://example.invalid
endpoints:
  - name: payments
    path: /payments
oracle:
  dsn_env: FLOWMAN_E2E_ORACLE_DSN
  user_env: FLOWMAN_E2E_ORACLE_USER
  password_env: FLOWMAN_E2E_ORACLE_PASSWORD
trace:
  transaction_id:
    header: X-Transaction-ID
    json_paths:
      - $.transaction_id
  poll_interval: 2s
  timeout: 5s
